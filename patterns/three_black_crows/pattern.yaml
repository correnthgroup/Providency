schema_version: 1

id: three_black_crows
display_name_pt: "Tres corvos negros"
name_en: "Three Black Crows"
family: BEARISH_REVERSAL
version: "0.1.0"

enabled: false
research_confidence: HIGH

recognition:
  input: TRADITIONAL_CANDLESTICKS
  visual_confidence_min: 0.95
  context:
    preceding_candles: 3
    rules:
      - {field: CLOSE_SEQUENCE, operator: EQ, value: ASCENDING}
  sequence:
    candles: 3
    rules:
      - {candle: 0, field: BODY_COLOR, operator: EQ, value: BEARISH}
      - {candle: 1, field: BODY_COLOR, operator: EQ, value: BEARISH}
      - {candle: 2, field: BODY_COLOR, operator: EQ, value: BEARISH}
      - {candle: 0, field: BODY_TO_RANGE, operator: GTE, value: 0.60}
      - {candle: 1, field: BODY_TO_RANGE, operator: GTE, value: 0.60}
      - {candle: 2, field: BODY_TO_RANGE, operator: GTE, value: 0.60}
      - {candle: 0, field: LOWER_WICK_TO_RANGE, operator: LTE, value: 0.15}
      - {candle: 1, field: LOWER_WICK_TO_RANGE, operator: LTE, value: 0.15}
      - {candle: 2, field: LOWER_WICK_TO_RANGE, operator: LTE, value: 0.15}
      - candle: 1
        field: OPEN
        operator: BETWEEN_EXCLUSIVE
        value: {candle: 0, lower_field: CLOSE, upper_field: OPEN}
      - candle: 2
        field: OPEN
        operator: BETWEEN_EXCLUSIVE
        value: {candle: 1, lower_field: CLOSE, upper_field: OPEN}
      - candle: 1
        field: CLOSE
        operator: LT
        value: {candle: 0, field: CLOSE}
      - candle: 2
        field: CLOSE
        operator: LT
        value: {candle: 1, field: CLOSE}

formation:
  description: "Apos alta previa, tres candles baixistas longos abrem dentro do corpo anterior, fecham progressivamente mais baixo e perto de suas minimas."

confirmation:
  mode: BAR_CLOSE

trigger:
  type: NEXT_BAR_BREAKOUT
  reference: PATTERN_LOW

stop:
  type: PATTERN_HIGH
  buffer_enabled: true

invalidation:
  rules:
    - "Fechamento acima de PATTERN_HIGH."
    - "Rompimento de PATTERN_HIGH antes do gatilho short."

target:
  reference_rr_min: 2.0
  reference_rr_max: 3.0

compatible_context_families:
  - BEARISH_REVERSAL
  - BEARISH_CONTINUATION
