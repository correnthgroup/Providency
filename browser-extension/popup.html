<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Conectar Providency</title>
<style>
body{font:14px system-ui;background:#10231d;color:#f7f8f5;width:300px;padding:20px;margin:0}
h1{font-size:22px}p{line-height:1.5;color:#cee0d7}label{display:block;margin-top:14px}
input,button{box-sizing:border-box;width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #79a995}
button{background:#1a8b65;color:white;font-weight:700;cursor:pointer}#status{min-height:35px}
</style>
<h1>Providency</h1><p>Conecte este navegador ao aplicativo aberto no seu computador.</p>
<form id="pair"><label>Porta local<input id="port" type="number" min="1024" max="65535" value="8765" required></label>
<label>Código exibido no Providency<input id="code" type="password" autocomplete="off" required></label>
<button type="submit">Conectar navegador</button></form>
<p id="status" role="status"></p>
<button id="disconnect" type="button">Desconectar</button>
<p>Somente abas da Vector e do Telegram Web são disponibilizadas. A sessão termina ao encerrar o Providency.</p>
<script src="popup.js"></script></html>
